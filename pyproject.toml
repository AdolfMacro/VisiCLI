[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visicli"
version = "0.1.0"
description = "A hand-controlled terminal explorer for Python project structure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "mediapipe>=1.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
visicli = "visicli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
